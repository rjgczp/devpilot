name: Approved HTTPS admission
on:
  pull_request:
    branches: [main]
    paths: ['cmd/privateapproval/**', 'cmd/privateworker/**', 'cmd/privateprobe/**', 'internal/monitoring/**', 'internal/probenetwork/**', 'internal/scheduler/**', 'internal/workerruntime/**', 'runtime/private/**', 'deploy/targetadmission/**', 'deploy/privateservice/**', 'tests/targetadmission/**', 'tests/integration/private_approved_test.go', 'tests/integration/private_service_test.go', '.github/workflows/target-admission.yml']
permissions:
  contents: read
jobs:
  approved-https:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Own HTTPS with full DNS binding on no-upstream Linux
        run: sh tests/targetadmission/run.sh "$RUNNER_TEMP/target-admission"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-admission
          path: ${{ runner.temp }}/target-admission/
          if-no-files-found: error
