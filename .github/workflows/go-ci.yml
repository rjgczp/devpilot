name: Go CI

on:
  push:
    branches:
      - main
      - codex/add-user-registration
      - codex/add-user-login
      - codex/add-workspace-foundation
      - codex/add-workspace-members
      - codex/add-workspace-invitations
      - codex/add-project-management
      - codex/add-http-monitor
      - codex/add-monitoring-engine
      - codex/add-monitor-activation-scheduler
      - codex/add-monitor-scheduler-worker
  pull_request:
    branches:
      - main

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CI_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record frozen checkout
        run: |
          test "$(git rev-parse HEAD)" = "$CI_EXPECTED_HEAD"
          python3 tests/scheduler/record.py --evidence "$RUNNER_TEMP/ci-context" --name checkout -- git show -s --format=fuller HEAD
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l cmd internal tests)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Test network classifier and audit build contract
        run: python3 -m unittest discover -s tests/network -p 'test_*.py' -v
      - name: Test independent execution classifier
        run: python3 -m unittest discover -s tests/execution -p 'test_*.py' -v
      - name: Check complete integration grouping contract
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py' -v
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: python3 tests/scheduler/record.py --evidence "$RUNNER_TEMP/verify-evidence" --name unit -- go test ./... -count=1
      - name: Run race tests
        run: python3 tests/scheduler/record.py --evidence "$RUNNER_TEMP/verify-evidence" --name race -- go test -race ./... -count=1
      - name: Upload verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: |
            ${{ runner.temp }}/ci-context/
            ${{ runner.temp }}/verify-evidence/
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: devpilot_test
          POSTGRES_PASSWORD: registration_test_only
          POSTGRES_DB: devpilot_registration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devpilot_test -d devpilot_registration_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://devpilot_test:registration_test_only@127.0.0.1:5432/devpilot_registration_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record frozen checkout
        run: |
          test "$(git rev-parse HEAD)" = "$CI_EXPECTED_HEAD"
          python3 tests/scheduler/record.py --evidence "$RUNNER_TEMP/ci-context" --name checkout -- git show -s --format=fuller HEAD
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned native Goose CLI
        run: go install -tags='no_clickhouse no_libsql no_mssql no_mysql no_sqlite3 no_vertica no_ydb' github.com/pressly/goose/v3/cmd/goose@v3.26.0
      - name: Verify complete PostgreSQL 18 integration in exact serial groups
        run: python3 tests/ci/run_integration.py --mode normal --evidence "$RUNNER_TEMP/integration-evidence/normal"
      - name: Verify complete PostgreSQL integration with race detector in exact serial groups
        run: python3 tests/ci/run_integration.py --mode race --evidence "$RUNNER_TEMP/integration-evidence/race"

      - name: Build Monitor network audit tools
        run: |
          mkdir -p "$RUNNER_TEMP/monitor-linux" "$RUNNER_TEMP/monitor-tools"
          CGO_ENABLED=0 GOTOOLCHAIN=local go test -c -tags=integration,networkaudit -o "$RUNNER_TEMP/monitor-linux/integration.test" ./tests/integration
          CGO_ENABLED=0 GOTOOLCHAIN=local GOBIN="$RUNNER_TEMP/monitor-tools" go install -tags='no_clickhouse no_libsql no_mssql no_mysql no_sqlite3 no_vertica no_ydb' github.com/pressly/goose/v3/cmd/goose@v3.26.0
          mkdir -p "$RUNNER_TEMP/monitor-network-evidence"
          python3 tests/network/check_audit_build.py "$RUNNER_TEMP/monitor-linux/integration.test" "$RUNNER_TEMP/monitor-tools/goose" > "$RUNNER_TEMP/monitor-network-evidence/builds.json"
          docker build -t devpilot-monitor-audit -f tests/network/Dockerfile .
      - name: Calibrate probe and audit real Monitor endpoints
        run: |
          mkdir -p "$RUNNER_TEMP/monitor-network-evidence"
          python3 tests/scheduler/record.py --evidence "$RUNNER_TEMP/monitor-network-evidence" --name api-audit -- \
          docker run --rm --cap-add NET_ADMIN --cap-add SYS_PTRACE \
            --network "container:${{ job.services.postgres.id }}" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/monitor-linux:/testtools:ro" \
            -v "$RUNNER_TEMP/monitor-tools:/toolbin:ro" \
            -v "$RUNNER_TEMP/monitor-network-evidence:/evidence" \
            -w "$GITHUB_WORKSPACE" \
            -e PATH=/toolbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e MONITOR_PROBE_ISOLATED=1 -e MONITOR_TEST_BINARY=/testtools/integration.test \
            -e MONITOR_AUDIT_OUTPUT=/evidence -e TEST_DATABASE_URL \
            devpilot-monitor-audit tests/network/run-monitor-audit.sh
      - name: Upload Monitor network audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-and-monitor-network-evidence
          path: |
            ${{ runner.temp }}/ci-context/
            ${{ runner.temp }}/integration-evidence/
            ${{ runner.temp }}/monitor-network-evidence/
          if-no-files-found: error

  execution-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: devpilot_test
          POSTGRES_PASSWORD: registration_test_only
          POSTGRES_DB: devpilot_registration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devpilot_test -d devpilot_registration_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://devpilot_test:registration_test_only@127.0.0.1:5432/devpilot_registration_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record frozen checkout
        run: |
          test "$(git rev-parse HEAD)" = "$CI_EXPECTED_HEAD"
          python3 tests/scheduler/record.py --evidence "$RUNNER_TEMP/ci-context" --name checkout -- git show -s --format=fuller HEAD
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned Goose
        run: go install -tags='no_clickhouse no_libsql no_mssql no_mysql no_sqlite3 no_vertica no_ydb' github.com/pressly/goose/v3/cmd/goose@v3.26.0
      - name: Validate internal DNS and address policy with bounded fuzz
        run: |
          go test ./internal/monitoring -run '^$' -fuzz '^FuzzDNSWire$' -fuzztime=5s -parallel=2
          go test ./internal/monitoring -run '^$' -fuzz '^FuzzAddressPolicy$' -fuzztime=5s -parallel=2
      - name: Independently verify real probe networking and egress isolation
        run: |
          python3 tests/scheduler/record.py --evidence "$RUNNER_TEMP/execution-meta" --name kernel-network -- \
            env EXECUTION_EVIDENCE="$RUNNER_TEMP/execution-network" sh tests/execution/run-docker.sh
      - name: Prepare separate guarded historical schema6 with pinned native Goose
        run: |
          python3 tests/scheduler/record.py --evidence "$RUNNER_TEMP/execution-meta" --name schema6 -- \
            go run -tags=integration ./tests/ci/snapshot-schema
      - name: Build credential-free Linux probe for PG controller
        run: |
          mkdir -p "$RUNNER_TEMP/execution-tools"
          CGO_ENABLED=0 GOTOOLCHAIN=local go test -c -tags=executionnet -o "$RUNNER_TEMP/execution-tools/execution.test" ./internal/monitoring
          go version -m "$RUNNER_TEMP/execution-tools/execution.test" > "$RUNNER_TEMP/execution-tools/build.txt"
      - name: Verify PG18 role snapshot and live network version isolation
        run: |
          EXECUTION_TEST_TOOLS="$RUNNER_TEMP/execution-tools" EXECUTION_PG_EVIDENCE="$RUNNER_TEMP/execution-pg" \
            python3 tests/scheduler/record.py --evidence "$RUNNER_TEMP/execution-meta" --name snapshot-normal \
              --binary "$RUNNER_TEMP/execution-tools/execution.test" -- \
              go test -tags=integration,executionsnapshot ./internal/monitoring -run '^TestSystemSnapshot' -count=1 -v -timeout=120s
      - name: Verify snapshot controller under Race Detector
        run: |
          EXECUTION_TEST_TOOLS="$RUNNER_TEMP/execution-tools" EXECUTION_PG_EVIDENCE="$RUNNER_TEMP/execution-pg-race" \
            python3 tests/scheduler/record.py --evidence "$RUNNER_TEMP/execution-meta" --name snapshot-race \
              --binary "$RUNNER_TEMP/execution-tools/execution.test" -- \
              go test -race -tags=integration,executionsnapshot ./internal/monitoring -run '^TestSystemSnapshot' -count=1 -v -timeout=120s
      - name: Build task6.4,6.5 and5.4 fixture-only tooling
        run: |
          docker build -t devpilot-scheduler-fixture -f tests/scheduler/Dockerfile .
          RELEASE54_TOOLS="$RUNNER_TEMP/network64-tools" \
            python3 tests/scheduler/record.py --evidence "$RUNNER_TEMP/network64-build" --name build -- sh tests/scheduler/build-release54.sh
      - name: Verify independent task6.4 dual-stack network policies and PG18 normal/race
        run: |
          python3 tests/scheduler/run-network64.py --tools "$RUNNER_TEMP/network64-tools" --evidence "$RUNNER_TEMP/network64-evidence"
      - name: Verify task6.5 independent physical stop and recovery with PG18 normal/race
        run: |
          python3 tests/scheduler/run-stop65.py --tools "$RUNNER_TEMP/network64-tools" --evidence "$RUNNER_TEMP/stop65-evidence"
      - name: Verify task5.4 committed physical receipts and atomic PG18 release normal/race
        run: |
          python3 tests/scheduler/run-release54.py --tools "$RUNNER_TEMP/network64-tools" --evidence "$RUNNER_TEMP/release54-evidence"
      - name: Upload separate execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-security-evidence
          path: |
            ${{ runner.temp }}/ci-context/
            ${{ runner.temp }}/execution-meta/
            ${{ runner.temp }}/execution-network/
            ${{ runner.temp }}/execution-pg/
            ${{ runner.temp }}/execution-pg-race/
            ${{ runner.temp }}/execution-tools/build.txt
            ${{ runner.temp }}/network64-build/
            ${{ runner.temp }}/network64-evidence/
            ${{ runner.temp }}/stop65-evidence/
            ${{ runner.temp }}/release54-evidence/
          if-no-files-found: error
