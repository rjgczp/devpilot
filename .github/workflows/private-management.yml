name: Private management
on:
  push:
    branches: [codex/private-management-entry]
  pull_request:
    branches: [main]
    paths: ['deploy/private/**', 'tests/private/**', 'internal/config/**', 'cmd/api/**', 'web/**', 'go.mod', 'go.sum', '.dockerignore', '.github/workflows/private-management.yml']
permissions:
  contents: read
jobs:
  private-management:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Configuration, Cookie and Origin contracts
        run: |
          go test ./internal/config ./internal/auth ./internal/app -count=1
          python3 -m unittest discover -s tests/private -p 'test_*.py' -v
      - name: Real private HTTPS ingress and restricted PG18 management
        run: python3 tests/private/run.py --require-host-ingress --logs "$RUNNER_TEMP/private-management"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-management
          path: ${{ runner.temp }}/private-management/
          if-no-files-found: error
