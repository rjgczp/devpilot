# Overlay for deploy/private/compose.yaml. SSH tunnel ingress only.
services:
  postgres:
    mem_limit: 256m
    shm_size: 64m
    cpus: 0.5
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20, -c, work_mem=2MB, -c, maintenance_work_mem=32MB]
    labels: {com.centurylinklabs.watchtower.enable: 'false'}
  api:
    mem_limit: 160m
    environment:
      GOMEMLIMIT: 100MiB
    labels: {com.centurylinklabs.watchtower.enable: 'false'}
  web:
    mem_limit: 64m
    labels: {com.centurylinklabs.watchtower.enable: 'false'}
networks:
  entry:
    ipam:
      config: [{subnet: 172.30.87.0/24}]
