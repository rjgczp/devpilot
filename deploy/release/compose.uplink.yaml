# Standalone namespace holder. Creating it does not attach any interface or
# enable the service. Use only on an individually approved Linux asset.
services:
  uplink:
    image: ${PRIVATE_RUNTIME_IMAGE:?pinned local runtime image ID required}
    pull_policy: never
    network_mode: none
    entrypoint: ["sleep"]
    command: ["infinity"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/var/lib/postgresql:ro,nosuid,noexec,size=4k"]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.default.accept_ra: "0"
      net.ipv6.conf.all.accept_ra: "0"
    pids_limit: 32
    mem_limit: 64m
    restart: "no"
