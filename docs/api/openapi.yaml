    "/api/v1/auth/logout": {
      "post": {
        "operationId": "logoutUser",
        "summary": "Idempotently revoke the current session",
        "security": [
          {},
          {
            "SessionCookie": []
          },
          {
            "DevelopmentSessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Exactly one serialized origin matching AUTH_ORIGIN by scheme, host and effective port; missing/null/duplicates rejected. No Host/Referer fallback."
          },
          {
            "in": "header",
            "name": "X-DevPilot-CSRF",
            "required": true,
            "schema": {
              "const": "1"
            },
            "description": "Exactly one header. CLI clients must also supply it. If Sec-Fetch-Site exists it must be exactly one same-origin value. No CORS permission."
          }
        ],
        "description": "No JSON body required or parsed. CSRF proof required even without a usable Cookie. Exactly one parseable current-mode Cookie selects a single digest to revoke regardless of expiry/account status. Missing, malformed or duplicated Cookie is idempotent 204 without choosing an arbitrary token. Confirmed revoke or no row returns empty 204 and deletes the current-mode Cookie. DB failure/timeout returns 500/503 and preserves Cookie for explicit idempotent retry; no automatic retry or claim of rollback. Previously validated requests may complete; overlapping login/logout responses have no deterministic browser Cookie ordering. Other sessions are unaffected.",
