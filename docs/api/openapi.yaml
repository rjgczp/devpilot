        "operationId": "updateProject",
        "summary": "Write project with current Owner authority",
        "description": "Project inherits current Workspace membership: Owner writes, Owner/Member read. All reads bind live active User, unrevoked Session with expires_at > database statement time, current membership and resource ownership in one snapshot. Nonmember/unknown/malformed/mismatched tenant resource all return404 project_not_found. Writes lock User -> Session -> Workspace -> Membership -> Project (update), then use a NEW statement for live Owner/expiry and scoped DML. Version increments for every successful PATCH including equal values; no automatic merge/retry/compensation. Confirmed Commit is required. Unknown Commit can have persisted; POST repeat can create duplicates. Request budget5s, whole DB operation2s. All outcomes forbid Set-Cookie and expose only fixed safe diagnostics, no-store/nosniff. No RLS, project roles, deletion, status, archive, transfer, slug, quota, aggregate listing or create idempotency. Invalid encoded/cleaned paths return404 without redirect. HEAD/OPTIONS405, no CORS. No query except list limit/after. If-Match on GET/POST and any If-None-Match/If-Modified-Since/If-Unmodified-Since/If-Range return400. Method -> CSRF proof -> Cookie syntax -> input -> live database authority/conditions. Single JSON object, case-sensitive only name/description strings, no duplicate/unknown keys, null, malformed UTF-8/surrogate escapes or trailing values. Raw body including escapes/whitespace/chunks at most16384 bytes. One application/json, optional charset=utf-8 only; any Content-Encoding rejected415. Name trims ASCII SP/HT/CR/LF edges then1–100 code points and <=400 UTF-8 bytes; rejects Cc or remaining Unicode edge whitespace. Description0–2000 code points/<=8000 bytes, preserves text/HT/LF, no other Cc including CR; empty string clears. No Unicode normalization. Reasons: required (empty name), invalid_length before invalid_format. PATCH omits unchanged fields; at least one supplied. Exactly one strong If-Match: \"project:<uuid>:<version>\", <=96 bytes, canonical lowercase UUID and positive canonical bigint. Weak/wildcard/multiple/invalid/overflow tag400. Business priority401 -> scope404 -> Member403 -> missing428 -> mismatch412; no current tag on error. Stale original condition never auto-refreshed.",
