        "description": "Cookie identity requires an active user and an unrevoked, unexpired session at database statement time. No Cookie mutation or sliding renewal; existing 24h default / 5m–24h TTL is unchanged. Session is not workspace authority. Method validation precedes POST CSRF, Cookie syntax, cheap input checks, then live DB authorization. HEAD returns 405 and no body; OPTIONS returns 405 without CORS. DB failures never fall back to cached identity. All responses are no-store and nosniff. Only name is accepted. Application/json with optional UTF-8 charset, exactly one Content-Type, no Content-Encoding, at most 4096 bytes including chunked data/trailing whitespace. Reject duplicate/unknown/missing/non-string fields, malformed UTF-8 and raw surrogate escapes with 400; unsupported media/encoding 415, body too large 413. Trim edge ASCII SP/HT/CR/LF then require 1–100 code points / <=400 UTF-8 bytes, reject Unicode Cc controls or remaining edge whitespace. Validation priority required, invalid_length, invalid_format. No Unicode normalization. User -> Session FOR SHARE locks, then a NEW INSERT statement rechecks expiry. Post-gate expiry may still commit. Both rows commit together. Success requires confirmed commit. Names need not be unique and cannot deduplicate unknown results. No workspace quota, joining, role grants, workspace updates or deletes in this version; member roster/removal/exit are separate endpoints. No query parameters.",
