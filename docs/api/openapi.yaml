        "description": "Exactly one canonical current-mode Cookie required. Every request joins current users and checks expires_at > database statement time, revoked_at IS NULL and users.status=active. Missing/ambiguous/malformed/unknown/expired/revoked/disabled identities share 401; DB failure is not 401 or cached authentication fallback. Read-only: no expiry/timestamp renewal or Set-Cookie on any me response. Default 24h absolute lifetime; physical cleanup is not needed to reject expired/revoked retained rows. No Refresh Token or refresh endpoint. Identity is only a query-time snapshot; entry authentication or an ordinary permission read in one transaction cannot guarantee Workspace authority throughout a future business operation. Future resource/action authorization must define coordination with membership/session/account changes and time expiry; Workspace/RBAC is not implemented here.",
