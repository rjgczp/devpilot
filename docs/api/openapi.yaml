        "summary": "Remove an ordinary member or leave the workspace",
        "description": "No query or nonempty body; no JSON input. Actor only comes from strict current environment Cookie. Same-origin CSRF before identity/DB. Owner may delete ordinary Members; Member may only delete itself; Owner cannot delete another Owner. Owner self-exit only if another owner relationship remains (409 last_owner_required otherwise); no active-owner availability guarantee. User FOR SHARE -> Session FOR SHARE -> Workspace FOR NO KEY UPDATE -> Membership FOR UPDATE sorted by user_id. Fresh statement after all waits rechecks active User, unrevoked/unexpired Session, current memberships/roles and owner count. Workspace serializes supported mutations. Expiry after final gate may still commit. Confirmed commit only204; Owner absence no-op204 without global user lookup. Self-exit retry404 after loss of membership; no old204 replay. Malformed target404 member_not_found only after Workspace authorization. No automatic retry or exactly-once/rejoin guarantee; unknown Commit may have committed. Client cancellation stops further work/responses. 5s/2s whole transaction budget, safe500/503; no Cookie mutation. Last-owner guarantee is application transaction protocol, not arbitrary SQL/RLS enforcement. No joining or role mutation endpoints.",
