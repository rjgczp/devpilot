    "/api/v1/auth/login": {
      "post": {
        "operationId": "loginUser",
        "summary": "Create a new PostgreSQL Cookie session",
        "security": [],
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Exactly one serialized origin matching AUTH_ORIGIN by scheme, host and effective port; missing/null/duplicates rejected. No Host/Referer fallback."
          },
          {
            "in": "header",
            "name": "X-DevPilot-CSRF",
            "required": true,
            "schema": {
              "const": "1"
            },
            "description": "Exactly one header. CLI clients must also supply it. If Sec-Fetch-Site exists it must be exactly one same-origin value. No CORS permission."
          }
        ],
        "description": "Strict 4096-byte JSON and original UTF-8/escape validation as registration. Login password accepts 1-128 code points and at most 512 UTF-8 bytes, preserving exact decoded bytes. Missing/disabled/wrong-password/invalid-PHC rejection uses identical 401 with one real or approved-cost dummy verification; dummy cannot authenticate. Shared two Argon slots, separate two complete login workflow slots, no queues. 5s processing and at most 2s per DB operation. State and password snapshot are rechecked under FOR SHARE in the creation transaction. Cookie issued only after confirmed commit. Unknown commit/cancellation is not evidence of rollback; no automatic retry. Default 24h absolute lifetime (configured range 5m-24h); no sliding renewal, Refresh Token or refresh endpoint. Every successful login creates an independent token; it does not revoke prior sessions. Login mitigation does not remove registration 409 enumeration. Public deployment still requires implemented/reviewed rate limiting and anti-brute-force controls.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "email",
                  "password"
                ],
                "properties": {
                  "email": {
                    "type": "string",
                    "description": "MVP ASCII dot-atom local part (1-64 bytes), DNS domain with at least two labels (1-63 bytes each). Trim outer ASCII SP/HT/CR/LF and lowercase whole address; canonical total <=254 bytes. No DNS validation, provider dot/tag folding or Unicode mailbox support. Unsupported formats may be valid elsewhere."
                  },
                  "password": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 128,
                    "writeOnly": true,
                    "description": "1-128 Unicode code points, <=512 UTF-8 bytes. No trimming, truncation or normalization; creation-only 15-character registration minimum is not applied."
                  }
                }
              },
              "example": {
                "email": "Alice.Example+tag@Example.COM",
                "password": "a long local test phrase"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Confirmed current active user identity; no proof of email ownership or Workspace permissions.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "const": "no-store"
                }
              },
              "X-Content-Type-Options": {
                "schema": {
                  "const": "nosniff"
                }
              },
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                },
                "description": "Production: __Host-devpilot_session=<43-character unpadded Base64URL>; Path=/; Secure; HttpOnly; SameSite=Lax; no Domain; bounded remaining Max-Age and UTC Expires. Explicit loopback HTTP development: devpilot_session, Secure omitted, all other scope attributes equal. Only the configured environment name is accepted; no token in JSON. Raw secret is 32 CSPRNG bytes; database stores only SHA-256(decoded secret)."
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "data"
