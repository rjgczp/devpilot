    "/api/v1/auth/register": {
      "post": {
        "operationId": "registerUser",
        "summary": "Register an enabled account with unverified email ownership",
        "description": "Body maximum 4096 bytes including trailing whitespace; one UTF-8 JSON object with exactly email/password string fields. Duplicate/unknown keys and malformed original Unicode escapes or unpaired surrogates are rejected before hashing. Two per-process Argon slots shared by registration and real/dummy login verification are resource protection, not rate limiting; public exposure requires separate reviewed anti-abuse controls. No tokens, sessions, cookies or mail. Client cancellation propagates and stops further work without attempting to guarantee a 503; a possibly committed INSERT is never described as definitely rolled back.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "email",
                  "password"
                ],
                "properties": {
                  "email": {
                    "type": "string",
                    "description": "MVP ASCII dot-atom local part (1-64 bytes), DNS domain with at least two labels (1-63 bytes each). Trim outer ASCII SP/HT/CR/LF and lowercase whole address; canonical total <=254 bytes. No DNS validation, provider dot/tag folding or Unicode mailbox support. Unsupported formats may be valid elsewhere."
                  },
                  "password": {
                    "type": "string",
                    "minLength": 15,
                    "maxLength": 128,
                    "writeOnly": true,
                    "description": "15-128 Unicode scalar/code points and <=512 UTF-8 bytes after strict raw escape validation. Valid surrogate pair counts as one, literal U+FFFD allowed. Never trim, truncate or Unicode-normalize. No composition rules."
                  }
                }
              },
              "example": {
                "email": "Alice.Example+tag@Example.COM",
                "password": "a long local test phrase"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created only after confirmed persistence. active means not disabled; email_verified_at remains NULL and email ownership is unverified.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/User"
                    }
                  }
                }
              }
            },
