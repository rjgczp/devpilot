  "components": {
    "schemas": {
      "User": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "email",
          "status",
          "created_at"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "description": "DB-generated UUIDv7; not a secret or authorization credential."
          },
          "email": {
            "type": "string"
          },
          "status": {
            "const": "active",
            "description": "Only not disabled, never proof of mailbox ownership or authentication."
          },
          "created_at": {
            "type": "string",
            "format": "date-time",
            "description": "UTC RFC3339 database timestamp."
          }
        }
      }
    },
    "securitySchemes": {
      "SessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-devpilot_session",
        "description": "Only production HTTPS mode accepts this name."
      },
      "DevelopmentSessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "devpilot_session",
        "description": "Only explicitly configured loopback HTTP development accepts this name; not simultaneously accepted with production name."
      }
    }
  }
}
